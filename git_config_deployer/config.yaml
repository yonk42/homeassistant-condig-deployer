name: Git Config Deployer
version: "1.2.0"
slug: git_config_deployer
description: >-
  Review pending git commits for your Home Assistant configuration,
  create a backup, pull, and reload — from the sidebar.
url: "https://example.invalid/git_config_deployer"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch-sync
panel_title: Git Config
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - homeassistant_config:rw
options:
  repo_path: /homeassistant
  remote: origin
  branch: ""
  ssh_key: ""
schema:
  repo_path: str
  remote: str
  branch: str
  ssh_key: str
