<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Config Deployer</title>
<style>
  :root{
    --bg:#11161d; --panel:#19212b; --panel2:#1f2935; --line:#2a3645;
    --text:#cfd8e3; --muted:#7d8a99;
    --add:#4fc06a; --del:#e06c5f; --accent:#e8a13c; --accent-ink:#1a1206;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 64px}

  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header h1{font:600 17px var(--sans);margin:0;letter-spacing:.2px}
  .repoline{font:12px var(--mono);color:var(--muted)}
  .repoline b{color:var(--text);font-weight:600}
  header button{margin-left:auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:14px 16px;margin-bottom:14px}
  .card h2{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;
           color:var(--muted);margin:0 0 10px}

  .statebig{font:600 16px var(--sans)}
  .statebig.ok{color:var(--add)} .statebig.pending{color:var(--accent)}
  .statebig.warn{color:var(--del)}
  .meta{font:12px var(--mono);color:var(--muted);margin-top:6px}
  .meta code{color:var(--text)}

  /* commit rail */
  .rail{list-style:none;margin:0;padding:0;position:relative}
  .rail li{position:relative;padding:4px 0 4px 26px}
  .rail li::before{content:"";position:absolute;left:7px;top:0;bottom:0;
        width:2px;background:var(--line)}
  .rail li:first-child::before{top:14px}
  .rail li:last-child::before{bottom:auto;height:14px}
  .rail li::after{content:"";position:absolute;left:3px;top:10px;width:10px;height:10px;
        border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .rail .sha{font:12px var(--mono);color:var(--accent)}
  .rail .subj{font:13px var(--mono)}
  .rail .who{font:11px var(--mono);color:var(--muted)}

  /* files */
  .file{border-top:1px solid var(--line)}
  .file:first-of-type{border-top:none}
  .filehead{display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;
        background:none;border:none;width:100%;text-align:left;color:inherit;font:inherit}
  .filehead:hover{background:var(--panel2)}
  .filehead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .arrow{color:var(--muted);font:11px var(--mono);width:12px;flex:none}
  .fpath{font:13px var(--mono);word-break:break-all}
  .kind{font:10px var(--mono);text-transform:uppercase;letter-spacing:.06em;
        padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);flex:none}
  .kind.added{color:var(--add);border-color:var(--add)}
  .kind.deleted{color:var(--del);border-color:var(--del)}
  .stat{margin-left:auto;font:12px var(--mono);flex:none}
  .stat .a{color:var(--add)} .stat .d{color:var(--del)}
  pre.diff{margin:0 0 8px;padding:10px 12px;background:#0c1117;border:1px solid var(--line);
        border-radius:6px;overflow-x:auto;font:12px/1.45 var(--mono);tab-size:4}
  pre.diff .l-add{color:var(--add)} pre.diff .l-del{color:var(--del)}
  pre.diff .l-hunk{color:#6fb3e0} pre.diff .l-meta{color:var(--muted)}

  /* apply */
  .applyrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  button{font:600 13px var(--sans);border-radius:6px;border:1px solid var(--line);
        background:var(--panel2);color:var(--text);padding:8px 14px;cursor:pointer}
  button:hover{border-color:var(--muted)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{font:12px var(--sans);color:var(--muted)}

  /* steps */
  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:10px;padding:6px 0;align-items:baseline}
  .sicon{font:13px var(--mono);width:18px;flex:none;text-align:center}
  .s-done .sicon{color:var(--add)} .s-error .sicon{color:var(--del)}
  .s-running .sicon{color:var(--accent)} .s-pending .sicon,.s-skipped .sicon{color:var(--muted)}
  .s-skipped{color:var(--muted)}
  .sdetail{display:block;font:12px var(--mono);color:var(--muted);word-break:break-word}
  .result{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13px}
  .result.ok{border:1px solid var(--add);color:var(--add)}
  .result.bad{border:1px solid var(--del);color:var(--del)}

  .banner{border:1px solid var(--del);color:var(--del);border-radius:6px;
        padding:10px 12px;margin-bottom:14px;font:13px var(--sans)}

  /* setup wizard */
  .setup p{margin:8px 0}
  .setup ol{margin:8px 0;padding-left:22px}
  .setup ol li{margin:4px 0}
  .setup code{font:12px var(--mono);color:var(--accent)}
  .note{border:1px solid var(--line);border-left:3px solid var(--accent);
        border-radius:6px;padding:8px 12px;font:13px var(--sans);
        color:var(--muted);margin:10px 0}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0}
  @media (max-width:560px){.formgrid{grid-template-columns:1fr}}
  .formgrid label{display:flex;flex-direction:column;gap:4px;
        font:12px var(--sans);color:var(--muted)}
  .formgrid label.wide{grid-column:1/-1}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);
        border-radius:6px;color:var(--text);font:13px var(--mono);
        padding:8px 10px;width:100%}
  input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .pubkey{font:11px/1.4 var(--mono);background:#0c1117;border:1px solid var(--line);
        border-radius:6px;padding:8px 10px;word-break:break-all;
        white-space:pre-wrap;user-select:all;margin:8px 0}
  details.setupblock{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  details.setupblock summary{cursor:pointer;color:var(--muted);
        font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.06em}
  details.setupblock[open] summary{margin-bottom:6px}
  pre.cmds{margin:8px 0;padding:10px 12px;background:#0c1117;
        border:1px solid var(--line);border-radius:6px;overflow-x:auto;
        font:12px/1.5 var(--mono)}
  /* coverage report card */
  .covgrp{border-top:1px solid var(--line);padding:10px 0 6px}
  .covgrp:first-of-type{border-top:none;padding-top:0}
  .covtitle{font:600 13px var(--sans);margin-bottom:4px}
  .covtitle.ok{color:var(--add)} .covtitle.move{color:var(--accent)}
  .covtitle.info{color:var(--muted)}
  .covgrp ul{margin:4px 0 6px;padding-left:20px}
  .covgrp li{margin:2px 0}
  .covgrp .hint{margin:4px 0}
  .migblock{margin:8px 0 12px}
  .migblock b{font:600 13px var(--sans)}
  .migrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0 4px}

  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
        border-top-color:var(--accent);border-radius:50%;vertical-align:-2px;
        animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Git Config Deployer</h1>
    <span class="repoline" id="repoline"></span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <div id="app"><p class="hint"><span class="spin"></span> Checking remote…</p></div>
</div>

<script>
"use strict";
const app = document.getElementById('app');
const repoline = document.getElementById('repoline');
let status = null;
let pollTimer = null;

const esc = s => s.replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => { try { return new Date(iso).toLocaleString(); } catch { return iso; } };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* ---------------- status view ---------------- */
async function loadStatus() {
  app.innerHTML = '<p class="hint"><span class="spin"></span> Fetching from remote…</p>';
  try { status = await api('api/status'); }
  catch (e) { app.innerHTML = `<div class="banner">${esc(e.message)}</div>`; return; }
  if (status.error) { app.innerHTML = `<div class="banner">${esc(status.error)}</div>`; return; }
  if (status.stage) { renderSetup(); return; }
  renderStatus();
}

/* ---------------- setup wizard ---------------- */
function renderSetup() {
  const s = status;
  repoline.innerHTML = `${esc(s.repo)} · <b>setup</b>`;

  const yamlNote = s.yaml_files.length
    ? ` The directory contains ${s.yaml_files.length} YAML file${s.yaml_files.length !== 1 ? 's' : ''}
        (${esc(s.yaml_files.slice(0, 5).join(', '))}${s.yaml_files.length > 5 ? ', …' : ''}).`
    : '';

  const sshBlock = `
    <details class="setupblock" ${s.stage !== 'init' || s.ssh_pubkey ? 'open' : ''}>
      <summary>SSH access (deploy key)</summary>
      <p class="hint">For SSH remotes (e.g. <code>git@github.com:you/ha-config.git</code>)
        the remote must accept a key from this add-on. Generate one here, then add the
        <b>public</b> key to the remote repository — on GitHub under
        Settings → Deploy&nbsp;keys, with <b>write access</b> enabled.
        ${s.ssh_key_option ? `Note: the configured <code>ssh_key</code> option
        (<code>${esc(s.ssh_key_option)}</code>) takes precedence over a generated key.` : ''}</p>
      <span id="keyslot">${s.ssh_pubkey
        ? `<div class="pubkey" id="pubkey">${esc(s.ssh_pubkey)}</div>
           <button type="button" id="copyKey">Copy public key</button>`
        : `<button type="button" id="genKey">Generate deploy key</button>`}</span>
      <span class="hint" id="keymsg"></span>
    </details>`;

  let intro = '', form = '', btnLabel = '';
  if (s.stage === 'init') {
    intro = `
      <div class="statebig warn">Repository not set up yet</div>
      <p><code>${esc(s.repo)}</code> is not a usable git repository${s.note ? ` (${esc(s.note)})` : ''}.${yamlNote}
        This add-on deploys configuration changes that arrive via git, so your
        configuration directory needs to become a repository first. The button
        below does it for you:</p>
      <ol>
        <li>Run <code>git init</code> in <code>${esc(s.repo)}</code>.</li>
        <li>Create a <code>.gitignore</code> that keeps <code>secrets.yaml</code>,
            <code>.storage/</code> (UI-managed settings), databases, logs and
            backups out of the repository.</li>
        <li>Commit your current configuration, exactly as it is.</li>
        <li>Optionally connect a remote and push, so you can edit on another
            machine and deploy here.</li>
      </ol>
      <div class="note">Mostly configuring Home Assistant through the UI? That is
        fine — those settings live in <code>.storage/</code> and simply stay local.
        The repository versions the YAML side (<code>configuration.yaml</code>,
        automations, scripts, …) and you can grow it at your own pace. Nothing
        about your current setup is changed or converted.</div>`;
    form = `
      <div class="formgrid">
        <label>Branch
          <input type="text" id="f_branch" value="${esc(s.branch)}"></label>
        <label>Remote URL <span>(optional, can be added later)</span>
          <input type="text" id="f_url" placeholder="git@github.com:you/ha-config.git"></label>
        <label>Commit author name <span>(optional)</span>
          <input type="text" id="f_name" placeholder="Home Assistant"></label>
        <label>Commit author e-mail <span>(optional)</span>
          <input type="text" id="f_email" placeholder="ha@example.com"></label>
      </div>`;
    btnLabel = 'Set up repository';
  } else if (s.stage === 'remote') {
    intro = `
      <div class="statebig warn">No remote configured</div>
      <p>The repository in <code>${esc(s.repo)}</code> exists
        ${s.head ? `(HEAD <code>${esc(s.head.short)}</code> ${esc(s.head.subject)})` : ''},
        but it has no remote named <code>${esc(s.remote)}</code> to deploy from.
        Enter the URL of an (ideally empty) repository on GitHub, GitLab, Gitea, … —
        the add-on connects it and pushes branch <code>${esc(s.branch)}</code>.</p>`;
    form = `
      <div class="formgrid">
        <label class="wide">Remote URL
          <input type="text" id="f_url" placeholder="git@github.com:you/ha-config.git"></label>
      </div>`;
    btnLabel = 'Connect remote and push';
  } else { /* stage === 'push' */
    intro = `
      <div class="statebig warn">Remote branch not found</div>
      <p>The remote <code>${esc(s.remote)}</code>
        (<code>${esc(s.remote_url || '')}</code>) has no branch
        <code>${esc(s.branch)}</code> yet — most likely nothing has been pushed
        so far. Push the local branch once; after that the add-on can compare
        local and remote and deploy incoming commits.</p>
      ${s.fetch_error ? `<div class="banner">Fetching from the remote also failed —
        if pushing fails too, fix access first (deploy key below, or the
        <code>remote</code>/<code>branch</code> add-on options).<br>
        <span class="sdetail">${esc(s.fetch_error)}</span></div>` : ''}`;
    btnLabel = `Push '${esc(s.branch)}' to ${esc(s.remote)}`;
  }

  app.innerHTML = `
    <section class="card setup">
      ${intro}
      ${form}
      ${sshBlock}
      <div class="applyrow" style="margin-top:14px">
        <button class="primary" id="setupBtn" type="button">${btnLabel}</button>
        <span class="hint">Everything runs locally in ${esc(s.repo)}; re-running is safe.</span>
      </div>
      <div id="jobview"></div>
    </section>
    <section class="card setup">
      <h2>Prefer doing it yourself?</h2>
      <p class="hint">SSH into Home Assistant (e.g. via the “Advanced SSH &amp; Web
        Terminal” add-on) and run, inside the configuration directory:</p>
      <pre class="cmds">cd ${esc(s.repo)}
git init -b ${esc(s.branch)}
git add -A
git commit -m "Initial Home Assistant configuration"
git remote add ${esc(s.remote)} &lt;your-remote-url&gt;
git push -u ${esc(s.remote)} ${esc(s.branch)}</pre>
      <p class="hint">Then press <b>Refresh</b> above. Typical workflow afterwards:
        clone the repository on your computer, edit YAML there, commit and push —
        then apply the change from this panel with a backup and config check.</p>
    </section>`;

  document.getElementById('setupBtn').addEventListener('click', startSetup);
  const gk = document.getElementById('genKey');
  if (gk) gk.addEventListener('click', genKey);
  const ck = document.getElementById('copyKey');
  if (ck) ck.addEventListener('click', copyKey);
}

async function startSetup() {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const body = {
    branch: val('f_branch') || status.branch,
    remote_url: val('f_url'),
    author_name: val('f_name'),
    author_email: val('f_email'),
    push: status.stage === 'push',
  };
  const jobview = document.getElementById('jobview');
  if (status.stage === 'remote' && !body.remote_url) {
    jobview.innerHTML = '<div class="result bad">Please enter a remote URL.</div>';
    return;
  }
  document.getElementById('setupBtn').disabled = true;
  try { await api('api/setup/init', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body) }); }
  catch (e) {
    jobview.innerHTML = `<div class="result bad">${esc(e.message)}</div>`;
    document.getElementById('setupBtn').disabled = false;
    return;
  }
  pollJob();
}

async function genKey() {
  const msg = document.getElementById('keymsg');
  msg.textContent = ' Generating…';
  try {
    const j = await api('api/setup/ssh_key', { method: 'POST' });
    status.ssh_pubkey = j.pubkey;
    document.getElementById('keyslot').innerHTML =
      `<div class="pubkey" id="pubkey">${esc(j.pubkey)}</div>
       <button type="button" id="copyKey">Copy public key</button>`;
    document.getElementById('copyKey').addEventListener('click', copyKey);
    msg.textContent = ' Key generated — add it to the remote repository with write access.';
  } catch (e) { msg.textContent = ' ' + e.message; }
}

async function copyKey() {
  const msg = document.getElementById('keymsg');
  try {
    await navigator.clipboard.writeText(status.ssh_pubkey || '');
    msg.textContent = ' Copied.';
  } catch {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('pubkey'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    msg.textContent = ' Selected — press Ctrl/Cmd-C to copy.';
  }
}

function renderStatus() {
  const s = status;
  repoline.innerHTML =
    `${esc(s.repo)} · <b>${esc(s.branch)}</b> → ${esc(s.target)}`;
  let h = '';

  if (s.fetch_error)
    h += `<div class="banner">Fetch from remote failed — showing last known state.<br>
          <span class="sdetail">${esc(s.fetch_error)}</span></div>`;

  /* current state card */
  const head = s.head ? `<code>${esc(s.head.short)}</code> ${esc(s.head.subject)}` : '—';
  const la = s.last_apply
    ? `Last applied via this add-on: <code>${esc(s.last_apply.to)}</code> on ${esc(fmtDate(s.last_apply.at))}`
    : 'No pulls applied via this add-on yet.';
  let stateLine, stateCls;
  if (s.diverged)      { stateLine = 'Local and remote have diverged'; stateCls = 'warn'; }
  else if (s.behind>0) { stateLine = `${s.behind} commit${s.behind!==1?'s':''} pending`; stateCls = 'pending'; }
  else                 { stateLine = 'Up to date with remote'; stateCls = 'ok'; }
  h += `<section class="card"><h2>State</h2>
    <div class="statebig ${stateCls}">${stateLine}</div>
    <div class="meta">HEAD ${head}<br>${la}<br>Checked ${esc(fmtDate(s.checked_at))}</div>
    ${s.dirty ? `<div class="banner" style="margin:10px 0 0">Working tree has uncommitted
      changes (${esc(s.dirty_files.join(', '))}). Applying is disabled until the tree is clean.</div>` : ''}
    ${s.diverged ? `<div class="banner" style="margin:10px 0 0">Local branch is ${s.ahead}
      commit${s.ahead!==1?'s':''} ahead of the remote. Resolve in the repository
      (rebase or push) before applying.</div>` : ''}
  </section>`;

  if (s.behind > 0) {
    /* commits rail (newest first, applied bottom-up) */
    h += `<section class="card"><h2>Incoming commits</h2><ul class="rail">` +
      s.commits.map(c => `<li>
        <span class="sha">${esc(c.short)}</span>
        <span class="subj">${esc(c.subject)}</span><br>
        <span class="who">${esc(c.author)} · ${esc(fmtDate(c.date))}</span>
      </li>`).join('') + `</ul></section>`;

    /* files */
    h += `<section class="card"><h2>Files changed (${s.files.length})</h2><div id="files">` +
      s.files.map((f, i) => `
        <div class="file">
          <button class="filehead" data-i="${i}" data-path="${esc(f.path)}"
                  aria-expanded="false" type="button">
            <span class="arrow" aria-hidden="true">▸</span>
            <span class="fpath">${esc(f.path)}${f.renamed_from
              ? ` <span class="hint">(from ${esc(f.renamed_from)})</span>` : ''}</span>
            <span class="kind ${esc(f.kind)}">${esc(f.kind)}</span>
            <span class="stat">${f.additions===null ? 'bin'
              : `<span class="a">+${f.additions}</span> <span class="d">−${f.deletions}</span>`}</span>
          </button>
          <div class="diffslot" id="diff-${i}" hidden></div>
        </div>`).join('') + `</div></section>`;

    /* apply */
    const blocked = s.dirty || s.diverged;
    h += `<section class="card"><h2>Apply</h2>
      <div class="applyrow">
        <label class="chk"><input type="checkbox" id="backup" checked>
          Create a full backup before applying</label>
        <button class="primary" id="applyBtn" type="button" ${blocked?'disabled':''}>
          Apply ${s.behind} commit${s.behind!==1?'s':''}</button>
      </div>
      <p class="hint">Backup → fast-forward pull → configuration check → reload.
      Reload covers YAML that Home Assistant can reload at runtime; new integrations
      may still need a restart.</p>
      <div id="jobview"></div>
    </section>`;
  }

  /* coverage report card (filled in asynchronously) */
  h += `<section class="card" id="coverage"><h2>Configuration coverage</h2>
    <p class="hint"><span class="spin"></span> Scanning configuration…</p></section>`;

  app.innerHTML = h;
  document.querySelectorAll('.filehead').forEach(b =>
    b.addEventListener('click', () => toggleDiff(b)));
  const ab = document.getElementById('applyBtn');
  if (ab) ab.addEventListener('click', startApply);
  loadCoverage();
}

/* ---------------- coverage / migration ---------------- */
async function loadCoverage() {
  const el = document.getElementById('coverage');
  if (!el) return;
  try { renderCoverage(await api('api/coverage')); }
  catch (e) {
    el.innerHTML = `<h2>Configuration coverage</h2>
      <div class="banner">${esc(e.message)}</div>`;
  }
}

function renderCoverage(cov) {
  const el = document.getElementById('coverage');
  if (!el) return;
  const d = cov.dashboards, hp = cov.helpers, fx = cov.fixed;

  /* in git */
  const core = cov.git.core_files.filter(f => f.exists && f.tracked)
    .map(f => f.file);
  const untracked = cov.git.core_files.filter(f => f.exists && !f.tracked)
    .map(f => f.file);
  let inGit = `<ul>
    <li>${cov.git.tracked_yaml} YAML file${cov.git.tracked_yaml!==1?'s':''} tracked
      ${core.length ? `(incl. ${esc(core.join(', '))})` : ''}</li>
    <li>Automations, scripts and scenes are stored as YAML even when edited in
      the UI — they are already covered by the repository.</li>
    ${d.yaml_mode ? '<li>Dashboards (Lovelace YAML mode)</li>' : ''}</ul>
    ${untracked.length ? `<p class="hint">⚠ Not tracked by git yet:
      ${esc(untracked.join(', '))} — commit them from the repository side.</p>` : ''}`;

  /* can move to git */
  let move = '';
  if (d.migratable) {
    const names = d.storage.map(x => esc(x.title)).join(', ');
    move += `<div class="migblock"><b>Dashboards</b>
      <ul><li>${d.storage.length} UI-managed dashboard${d.storage.length!==1?'s':''}:
        ${names}</li>
      ${d.resources ? `<li>${d.resources} dashboard resource${d.resources!==1?'s':''}
        (custom cards)</li>` : ''}</ul>
      <div class="migrow">
        <button class="primary migbtn" id="migDash" type="button">
          Migrate dashboards to YAML…</button>
        <label class="chk"><input type="checkbox" id="dashRestart" checked>
          Restart Home Assistant afterwards (activates YAML mode)</label>
      </div>
      <p class="hint">Exports every dashboard to a YAML file, commits, and sets
        <code>lovelace: mode: yaml</code>. Afterwards dashboards are edited via
        git — the UI dashboard editor is disabled. A full backup is created first.</p>
      ${manualDashHelp()}
    </div>`;
  } else if (!d.yaml_mode) {
    move += `<p class="hint">Dashboards: only the auto-generated default —
      nothing UI-managed to migrate.</p>`;
  }
  if (hp.migratable) {
    const list = hp.domains.filter(x => x.count && !x.in_yaml)
      .map(x => `${esc(x.domain)} ×${x.count}`).join(', ');
    move += `<div class="migblock"><b>Helpers</b>
      <ul><li>${hp.storage_total} UI-created helper${hp.storage_total!==1?'s':''}:
        ${list}</li></ul>
      ${hp.blocked.length ? `<p class="hint">⚠ ${esc(hp.blocked.join(', '))}
        already exist${hp.blocked.length===1?'s':''} in configuration.yaml —
        those domains are skipped (merge manually).</p>` : ''}
      <div class="migrow">
        <button class="primary migbtn" id="migHelp" type="button">
          Migrate helpers to YAML…</button>
        <span class="hint">Restarts Home Assistant (required).</span>
      </div>
      <p class="hint">Exports the helpers to <code>helpers/&lt;domain&gt;.yaml</code>,
        commits, and removes them from UI storage. Entity IDs stay the same, so
        automations and history keep working. A full backup is created first.</p>
      ${manualHelpersHelp()}
    </div>`;
  } else if (!hp.storage_total) {
    move += `<p class="hint">Helpers: no UI-created helpers found.</p>`;
  }
  if (!d.migratable && !hp.migratable)
    move = `<p class="hint">Nothing to migrate — dashboards and helpers are
      either in YAML mode already or were never created in the UI.</p>`;

  /* stays in HA */
  const stays = `<ul>
    <li>${fx.config_entries} integration entr${fx.config_entries!==1?'ies':'y'}
      ${fx.helper_entries ? `(incl. ${fx.helper_entries} template/derived
        helper${fx.helper_entries!==1?'s':''})` : ''},
      ${fx.devices} devices, ${fx.entities} entities, ${fx.areas} areas,
      ${fx.users} user${fx.users!==1?'s':''}</li></ul>
    <p class="hint">Integration setup, device pairings, areas and users are
      runtime state in <code>.storage/</code> — they have no YAML form and are
      covered by Home Assistant backups, not git.</p>`;

  el.innerHTML = `<h2>Configuration coverage</h2>
    <div class="covgrp"><div class="covtitle ok">✓ In git (YAML)</div>${inGit}</div>
    <div class="covgrp"><div class="covtitle move">⚠ Can move to git</div>${move}
      <div id="migjobview"></div></div>
    <div class="covgrp"><div class="covtitle info">ℹ Stays in Home Assistant</div>${stays}</div>`;

  const md = document.getElementById('migDash');
  if (md) md.addEventListener('click', () => startMigrate('dashboards'));
  const mh = document.getElementById('migHelp');
  if (mh) mh.addEventListener('click', () => startMigrate('helpers'));
}

function manualDashHelp() {
  return `<details class="setupblock"><summary>Do it manually instead</summary>
    <ol>
      <li>Convert the <code>data.config</code> object of
        <code>.storage/lovelace</code> from JSON to YAML and save it as
        <code>ui-lovelace.yaml</code> (and each <code>.storage/lovelace.&lt;id&gt;</code>
        as <code>dashboards/&lt;url-path&gt;.yaml</code>).</li>
      <li>Add to <code>configuration.yaml</code>:</li>
    </ol>
    <pre class="cmds">lovelace:
  mode: yaml
  dashboards:
    my-dashboard:           # url path (must contain a hyphen)
      mode: yaml
      title: My dashboard
      filename: dashboards/my-dashboard.yaml</pre>
    <ol start="3">
      <li>Restart Home Assistant, verify, then commit and push.</li>
    </ol></details>`;
}

function manualHelpersHelp() {
  return `<details class="setupblock"><summary>Do it manually instead</summary>
    <ol>
      <li>For each <code>.storage/input_boolean</code>, <code>counter</code>, …:
        turn every entry of <code>data.items</code> into YAML keyed by its
        <code>id</code> (drop the <code>id</code> field), e.g.:</li>
    </ol>
    <pre class="cmds"># helpers/input_boolean.yaml
guest_mode:
  name: Guest mode
  icon: mdi:account-check</pre>
    <ol start="2">
      <li>Reference it: <code>input_boolean: !include helpers/input_boolean.yaml</code></li>
      <li>Move the <code>.storage/&lt;domain&gt;</code> file out of the way
        (otherwise the helpers exist twice) and restart Home Assistant.</li>
      <li>Verify, then commit and push.</li>
    </ol></details>`;
}

async function startMigrate(kind) {
  let body = {};
  let msg;
  if (kind === 'dashboards') {
    const restart = document.getElementById('dashRestart').checked;
    body = { restart };
    msg = 'Export all dashboards to YAML files, commit, and switch Lovelace to YAML mode?\n\n' +
      '• A full backup is created first.\n' +
      '• Dashboards are edited via git/YAML afterwards — the UI dashboard editor is disabled.\n' +
      (restart ? '• Home Assistant restarts at the end to activate YAML mode.'
               : '• You will need to restart Home Assistant yourself to activate YAML mode.');
  } else {
    msg = 'Export all UI-created helpers to YAML files, commit, and remove them from UI storage?\n\n' +
      '• A full backup is created first.\n' +
      '• Entity IDs stay the same — automations and history keep working.\n' +
      '• Helpers are edited via git/YAML afterwards (no UI editing).\n' +
      '• Home Assistant RESTARTS at the end — this is required.';
  }
  if (!confirm(msg)) return;
  document.querySelectorAll('.migbtn').forEach(b => { b.disabled = true; });
  try { await api('api/migrate/' + kind, { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body) }); }
  catch (e) {
    const v = document.getElementById('migjobview');
    if (v) v.innerHTML = `<div class="result bad">${esc(e.message)}</div>`;
    document.querySelectorAll('.migbtn').forEach(b => { b.disabled = false; });
    return;
  }
  pollJob();
}

/* ---------------- diffs ---------------- */
async function toggleDiff(btn) {
  const slot = document.getElementById('diff-' + btn.dataset.i);
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  btn.querySelector('.arrow').textContent = open ? '▸' : '▾';
  slot.hidden = open;
  if (open || slot.dataset.loaded) return;
  slot.innerHTML = '<p class="hint"><span class="spin"></span> Loading diff…</p>';
  try {
    const j = await api('api/diff?path=' + encodeURIComponent(btn.dataset.path));
    slot.innerHTML = `<pre class="diff">${colorDiff(j.diff || '(no textual diff)')}</pre>`;
    slot.dataset.loaded = '1';
  } catch (e) { slot.innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
}

function colorDiff(text) {
  return text.split('\n').map(l => {
    const e = esc(l);
    if (l.startsWith('+++') || l.startsWith('---') || l.startsWith('diff ')
        || l.startsWith('index ')) return `<span class="l-meta">${e}</span>`;
    if (l.startsWith('@@')) return `<span class="l-hunk">${e}</span>`;
    if (l.startsWith('+')) return `<span class="l-add">${e}</span>`;
    if (l.startsWith('-')) return `<span class="l-del">${e}</span>`;
    return e;
  }).join('\n');
}

/* ---------------- apply ---------------- */
async function startApply() {
  const backup = document.getElementById('backup').checked;
  const n = status.behind;
  const q = backup
    ? `Create a full backup, then apply ${n} commit${n!==1?'s':''} and reload?`
    : `Apply ${n} commit${n!==1?'s':''} WITHOUT a backup and reload?`;
  if (!confirm(q)) return;
  document.getElementById('applyBtn').disabled = true;
  try { await api('api/apply', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ backup }) }); }
  catch (e) {
    document.getElementById('jobview').innerHTML =
      `<div class="result bad">${esc(e.message)}</div>`;
    document.getElementById('applyBtn').disabled = false;
    return;
  }
  pollJob();
}

async function pollJob() {
  clearTimeout(pollTimer);
  let job;
  try { job = await api('api/apply/status'); }
  catch { pollTimer = setTimeout(pollJob, 2000); return; }
  renderJob(job);
  if (job.running) { pollTimer = setTimeout(pollJob, 1500); return; }
  if (job.result && job.result.ok) {
    // If the job restarted Home Assistant, this panel is about to go away
    // with it — leave the result message visible instead of refreshing.
    const restarted = (job.steps || []).some(
      s => s.id === 'restart' && s.status === 'done');
    if (!restarted) setTimeout(loadStatus, 2500);
    return;
  }
  const sb = document.getElementById('setupBtn');
  if (sb) sb.disabled = false;  // allow retrying setup after a failure
  document.querySelectorAll('.migbtn').forEach(b => { b.disabled = false; });
}

function renderJob(job) {
  const mig = (job.kind || '').indexOf('migrate') === 0;
  const v = (mig && document.getElementById('migjobview'))
    || document.getElementById('jobview')
    || document.getElementById('migjobview');
  if (!v || !job.steps) return;
  const icon = st => ({done:'✓', error:'✗', running:'<span class="spin"></span>',
                       skipped:'–', pending:'·'}[st] || '·');
  let h = '<ul class="steps">' + job.steps.map(s => `
    <li class="s-${s.status}">
      <span class="sicon">${icon(s.status)}</span>
      <span>${esc(s.label)}
        ${s.detail ? `<span class="sdetail">${esc(s.detail)}</span>` : ''}</span>
    </li>`).join('') + '</ul>';
  if (job.result)
    h += `<div class="result ${job.result.ok?'ok':'bad'}">${esc(job.result.message)}</div>`;
  v.innerHTML = h;
}

/* ---------------- init ---------------- */
document.getElementById('refresh').addEventListener('click', loadStatus);
(async () => {
  // If an apply is still running (page reopened mid-job), show it.
  try {
    const job = await api('api/apply/status');
    if (job.running) {
      const titles = { setup: 'Setup in progress',
                       migrate_dashboards: 'Dashboard migration in progress',
                       migrate_helpers: 'Helper migration in progress' };
      const title = titles[job.kind] || 'Apply in progress';
      app.innerHTML = `<section class="card"><h2>${title}</h2><div id="jobview"></div></section>`;
      renderJob(job); pollJob(); return;
    }
  } catch {}
  loadStatus();
})();
</script>
